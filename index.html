<style>
:root{
  --bg:#eceff5; --panel:#ffffff; --panel2:#f3f5fa; --ink:#0f1a2c; --muted:#5a677e; --line:#d6dce9;
  --sun:#d96f00; --accent:#2756d4; --done:#14833b; --glass:rgba(255,255,255,.9);
  --shadow:0 1px 2px rgba(15,26,44,.06),0 8px 24px rgba(15,26,44,.06);
  --f-head:"Space Grotesk",system-ui,sans-serif; --f-body:Inter,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#080d18; --panel:#101828; --panel2:#16223a; --ink:#e9eef8; --muted:#8e9db8; --line:#233250;
    --sun:#ffb23e; --accent:#8aacff; --done:#58d68d; --glass:rgba(16,24,40,.9);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#080d18; --panel:#101828; --panel2:#16223a; --ink:#e9eef8; --muted:#8e9db8; --line:#233250;
  --sun:#ffb23e; --accent:#8aacff; --done:#58d68d; --glass:rgba(16,24,40,.9);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:22px 48px}
.app{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font:700 clamp(28px,5vw,40px)/1.05 var(--f-head);letter-spacing:-.02em;margin:0}
h2{font:600 18px/1.3 var(--f-head);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:60ch}
.eyebrow{font:500 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.tile{background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;min-width:150px}
.tile .k{font-size:11.5px;opacity:.7;letter-spacing:.04em}
.tile .v{font:600 26px/1.1 var(--f-head);font-variant-numeric:tabular-nums}
.stage{position:relative;height:clamp(380px,64vh,580px);border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--bg);touch-action:none}
.stage canvas{display:block;width:100%;height:100%;cursor:grab}
.fsbtn{position:absolute;right:10px;bottom:10px;z-index:2;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--glass);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.fsbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fsbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stage:fullscreen{height:100vh;height:100dvh;width:100%;border:0;border-radius:0;background:var(--bg)}
.stage:-webkit-full-screen{height:100vh;width:100%;border:0;border-radius:0;background:var(--bg)}
.stage canvas:active{cursor:grabbing}
.tools{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.tools button{font:600 14px/1 var(--f-body);width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--glass);color:var(--ink);cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tools button{display:grid;place-items:center;padding:0}
.tools svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tools button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);background:var(--glass);padding:4px 8px;border-radius:8px;z-index:2;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-115%);pointer-events:none;white-space:nowrap;font:600 12px/1 var(--f-body);padding:6px 9px;border-radius:8px;background:var(--ink);color:var(--bg);opacity:0;transition:opacity .15s;z-index:1}
.tag.on{opacity:1}
.tag.hot{background:var(--sun);color:#1a1000}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.namerow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.namerow label{color:var(--muted)}
input[type=text]{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-width:0;flex:1 1 180px}
input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sheet{display:grid;gap:10px}
.sheet[hidden]{display:none}
.sheet .addr{color:var(--muted)}
.sheet .status{color:var(--muted);font-size:13.5px}
.sheet img{width:100%;height:auto;border-radius:12px;display:block}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{position:relative;display:inline-block;font:600 14px/1.2 var(--f-body);background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:10px 18px;cursor:pointer;overflow:hidden}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-within,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.btn.dim{opacity:.5;cursor:default}
.pintcard{flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
.pintcard > div:empty{display:none}
.pint{position:relative;width:100%;max-width:520px;height:40px;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--panel2)}
.beer{position:absolute;top:0;bottom:0;left:0;width:var(--fill,0%);background:linear-gradient(180deg,#fcd66b,#f7b733 50%,#e08e0b);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.beer::after{content:"";position:absolute;right:-7px;top:-3px;bottom:-3px;width:18px;background:#fff6dc;border-radius:50%;animation:slosh 3.2s ease-in-out infinite alternate}
.beer.empty::after{display:none}
@keyframes slosh{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
.pintlabel{font:500 15px var(--f-body);color:var(--muted)}
.pintlabel span{font:600 22px var(--f-head);color:var(--ink);font-variant-numeric:tabular-nums}
.findbox{display:grid;gap:8px}
.findbox .lbl{color:var(--muted);font-size:13px}
.findbox input[type=search]{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;width:100%}
.results{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.results:empty{display:none}
.results button{width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.results button:hover{border-color:var(--muted)}
.results button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.results .none{color:var(--muted);font-size:13px;padding:6px 4px}
.wxbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.wxbtns button{font:500 12px var(--f-body);border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer}
.wxbtns button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.wxbtns button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:600px){
  input[type=text],input[type=search]{font-size:16px;min-height:44px}
  .tools button,.fsbtn{width:44px;height:44px}
  .tools svg,.fsbtn svg{width:22px;height:22px}
  .btn{min-height:44px;display:inline-flex;align-items:center}
  .results button{min-height:44px}
  .wxbtns button{min-height:38px;padding:6px 12px}
  .hint{display:none}
  .stage{height:min(62vh,520px);min-height:340px}
  .pint{height:34px}
  .sheet{padding:14px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} .beer::after{animation:none} }
</style>
</head>

      <span><i style="background:var(--done)"></i>Done</span>
      <span><i style="background:var(--sun)"></i>Airbnb (Sokolská 1605)</span>
    </div>
    <div class="legend">Map data © OpenStreetMap contributors</div>
  </div>

  <div class="card sheet" id="sheet" hidden></div>

  <div class="card" id="weather" style="color:var(--muted)"><span id="wxtext">Loading weather…</span></div>

  <div class="card findbox">

    <input type="search" id="find" placeholder="Type a pub name or street" autocomplete="off">
    <ul id="results" class="results"></ul>

</div>

const HOME = { name: "Airbnb", street: "Sokolská 1605", lat: 50.0768087, lon: 14.4293390 };

// ---------- storage (per phone until the shared backend is added) ----------
const KEY = "pubtracker-v1";
let state = { name: "", done: {} };
try { state = Object.assign(state, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); return true; } catch (e) { return false; } }

// ---------- map geometry: 1 world unit = 1 km ----------
const LAT0 = 50.058, LAT1 = 50.095, LON0 = 14.405, LON1 = 14.455;
const KM_LAT = 111.2, KM_LON = 111.2 * Math.cos(50.0765 * Math.PI / 180);
const WW = (LON1 - LON0) * KM_LON, WH = (LAT1 - LAT0) * KM_LAT;
const toWorld = (lat, lon) => new THREE.Vector3((lon - LON0) * KM_LON - WW / 2, 0, -((lat - LAT0) * KM_LAT - WH / 2));

// Palettes follow the Daylight Year tokens.
const PAL = {
  light: { bg: "#eceff5", ground: "#e3e8f2", minor: "#ffffff", mid: "#fbfcfe", major: "#ffffff", water: "#9fc0ea", slab: "#c3cad9", bld: "#f4f5f8", todo: "#8a93a6", done: "#14833b", home: "#d96f00", ring: "#2756d4" },
  dark:  { bg: "#080d18", ground: "#0c1322", minor: "#1d2a45", mid: "#2e3d62", major: "#3a4d78", water: "#1d3a66", slab: "#050a14", bld: "#27344f", todo: "#4d5876", done: "#58d68d", home: "#ffb23e", ring: "#8aacff" }
};
const isDark = () => {
  const t = document.documentElement.dataset.theme;
  return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
};
const pal = () => PAL[isDark() ? "dark" : "light"];

// ---------- renderer and scene ----------
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.05, 100);
const DEFAULT_POS = new THREE.Vector3(0, 6.2, 4.4);
camera.position.copy(DEFAULT_POS);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 0.8;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.47;
controls.screenSpacePanning = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.95));
const sunLight = new THREE.DirectionalLight(0xffffff, 0.5);
sunLight.position.set(2, 5, 3);
scene.add(sunLight);

const world = new THREE.Group();
scene.add(world);

// Diorama base: a map-printed slab with a thin edge.
const groundMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(WW, WH).rotateX(-Math.PI / 2), groundMat);
world.add(ground);
const slabMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
const slab = new THREE.Mesh(new THREE.BoxGeometry(WW + 0.04, 0.05, WH + 0.04), slabMat);
slab.position.y = -0.026;
world.add(slab);

// ---------- buildings: footprints from the OSM export, extruded ----------
const BUILD_VERT = 2.5; // vertical exaggeration so the city reads at this scale
const buildingMat = new THREE.MeshStandardMaterial({ color: 0xf4f5f8, roughness: 0.85 });
function buildBuildings() {
  const list = window.BUILDINGS_DATA || [];
  if (!list.length) return;
  const geos = [];
  for (const [h, ring] of list) {
    const shape = new THREE.Shape();
    ring.forEach(([lat, lon], j) => {
      const x = (lon - LON0) * KM_LON - WW / 2;
      const y = (lat - LAT0) * KM_LAT - WH / 2;
      if (j) shape.lineTo(x, y); else shape.moveTo(x, y);
    });
    const g = new THREE.ExtrudeGeometry(shape, { depth: (h / 1000) * BUILD_VERT, bevelEnabled: false });
    geos.push(g.rotateX(-Math.PI / 2));
  }
  world.add(new THREE.Mesh(mergeGeometries(geos, false), buildingMat));
}

// ---------- street texture, drawn from the OSM export ----------
let LINES = [];
let tex = null;
const CW = 2048, CH = Math.round(CW * WH / WW);
const pxy = (lat, lon) => [(lon - LON0) / (LON1 - LON0) * CW, (LAT1 - lat) / (LAT1 - LAT0) * CH];

function drawMap(p) {
  const c = document.createElement("canvas");
  c.width = CW; c.height = CH;
  const g = c.getContext("2d");
  g.fillStyle = p.ground; g.fillRect(0, 0, CW, CH);
  g.lineCap = "round"; g.lineJoin = "round";
  const layers = [["minor", 2.2, p.minor], ["mid", 4.5, p.mid], ["major", 8, p.major], ["water", 46, p.water]];
  for (const [cls, width, color] of layers) {
    g.strokeStyle = color; g.lineWidth = width;
    for (const [k, pts] of LINES) {
      if (k !== cls) continue;
      g.beginPath();
      pts.forEach((ll, j) => { const [x, y] = pxy(ll[0], ll[1]); j ? g.lineTo(x, y) : g.moveTo(x, y); });
      g.stroke();
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

// ---------- pubs ----------
const stemGeo = new THREE.CylinderGeometry(0.0025, 0.0025, 0.045, 8);
const headGeo = new THREE.SphereGeometry(0.012, 16, 12);
const pins = PUBS.map((p, i) => {
  const g = new THREE.Group();
  const m = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.5, depthTest: false });
  const stem = new THREE.Mesh(stemGeo, m); stem.position.y = 0.0225; stem.renderOrder = 2;
  const head = new THREE.Mesh(headGeo, m); head.position.y = 0.047; head.renderOrder = 2;
  head.userData.i = i;
  g.add(stem, head);
  g.position.copy(toWorld(p[2], p[3]));
  world.add(g);
  return { g, m, head };
});

// Selected pub ring
const ringMat = new THREE.MeshBasicMaterial({ color: 0x2756d4, transparent: true, opacity: 0.9, depthTest: false });
const selRing = new THREE.Mesh(new THREE.RingGeometry(0.02, 0.028, 48).rotateX(-Math.PI / 2), ringMat);
selRing.renderOrder = 2;
selRing.visible = false;
world.add(selRing);

// Airbnb beacon
const hp = toWorld(HOME.lat, HOME.lon);
const beacon = new THREE.Group();
beacon.position.copy(hp);
const poleMat = new THREE.MeshStandardMaterial({ color: 0xd96f00, depthTest: false });
const topMat = new THREE.MeshStandardMaterial({ color: 0xd96f00, emissive: 0x552200, depthTest: false });
const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.0035, 0.0035, 0.2, 10), poleMat);
pole.position.y = 0.1;
const top = new THREE.Mesh(new THREE.SphereGeometry(0.03, 20, 14), topMat);
top.position.y = 0.22;
const homeRingMat = new THREE.MeshBasicMaterial({ color: 0xd96f00, transparent: true, opacity: 0.8, depthTest: false });
const homeRing = new THREE.Mesh(new THREE.RingGeometry(0.04, 0.05, 48).rotateX(-Math.PI / 2), homeRingMat);
homeRing.position.y = 0.004;
beacon.add(pole, top, homeRing);
world.add(beacon);

// Colour everything from the active palette and the saved progress.
function applyPalette() {
  const p = pal();
  scene.background = new THREE.Color(p.bg);
  if (tex) tex.dispose();
  tex = drawMap(p);
  groundMat.map = tex; groundMat.needsUpdate = true;
  slabMat.color.set(p.slab);
  buildingMat.color.set(p.bld);
  poleMat.color.set(p.home); topMat.color.set(p.home); homeRingMat.color.set(p.home);
  ringMat.color.set(p.ring);
  refreshPins();
}
function refreshPins() {
  const p = pal();
  pins.forEach((pin, i) => {
    pin.m.color.set(state.done[i] ? p.done : p.todo);
    const s = i === selected ? 1.35 : 1;
    pin.g.scale.set(s, s, s);
  });
  const doneN = Object.keys(state.done).length;
  document.getElementById("count").textContent = `${doneN} / ${PUBS.length}`;
  const beer = document.getElementById("beer");
  beer.style.setProperty("--fill", (doneN / PUBS.length * 100).toFixed(1) + "%");
  beer.classList.toggle("empty", doneN === 0);
}

// ---------- selection and tap ----------
let selected = null;
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener("pointerdown", e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", e => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]);
  downAt = null;
  if (moved > 6) return;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pins.map(p => p.head), false)[0];
  if (hit) select(hit.object.userData.i);
});

function select(i, scroll = true) {
  selected = i;
  const pin = pins[i];
  selRing.visible = true;
  selRing.position.set(pin.g.position.x, 0.004, pin.g.position.z);
  refreshPins();
  renderSheet();
  if (scroll) document.getElementById("sheet").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

// ---------- camera controls ----------
function flyTo(target) {
  const offset = camera.position.clone().sub(controls.target);
  controls.target.copy(target);
  camera.position.copy(target).add(offset);
  controls.update();
}

// ---------- find a pub ----------
const findInput = document.getElementById("find");
const results = document.getElementById("results");
function goToPub(i) {
  select(i, false);
  const pg = pins[i].g.position;
  flyTo(new THREE.Vector3(pg.x, 0, pg.z));
  findInput.value = "";
  results.replaceChildren();
  stage.scrollIntoView({ behavior: "smooth", block: "center" });
}
findInput.addEventListener("input", () => {
  const q = findInput.value.trim().toLowerCase();
  results.replaceChildren();
  if (!q) return;
  const hits = PUBS.map((p, i) => [p, i])
    .filter(([p]) => p[0].toLowerCase().includes(q) || p[1].toLowerCase().includes(q))
    .slice(0, 8);
  if (!hits.length) {
    results.appendChild(el("li", { class: "none", text: "No pub matches that yet." }));
    return;
  }
  for (const [p, i] of hits) {
    const label = p[0] + (p[1] ? " · " + p[1] : "") + (state.done[i] ? "  ✓ done" : "");
    results.appendChild(el("li", {}, [el("button", { text: label, onclick: () => goToPub(i) })]));
  }
});
document.getElementById("zin").onclick = () => { controls.dollyIn(1.25); controls.update(); };
document.getElementById("zout").onclick = () => { controls.dollyOut(1.25); controls.update(); };
document.getElementById("reset").onclick = () => { camera.position.copy(DEFAULT_POS); controls.target.set(0, 0, 0); controls.update(); };
// ---------- full screen icon (the stage only; the preview may refuse it) ----------
const ICON_EXPAND = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
const ICON_COLLAPSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
const fullBtn = document.getElementById("full");
fullBtn.innerHTML = ICON_EXPAND;
if (!document.fullscreenEnabled) fullBtn.hidden = true;
fullBtn.onclick = () => {
  if (document.fullscreenElement) { document.exitFullscreen(); return; }
  stage.requestFullscreen().catch(() => { fullBtn.title = "Full screen isn't available here"; });
};
document.addEventListener("fullscreenchange", () => {
  const on = !!document.fullscreenElement;
  fullBtn.innerHTML = on ? ICON_COLLAPSE : ICON_EXPAND;
  const label = on ? "Exit full screen" : "Full screen";
  fullBtn.title = label;
  fullBtn.setAttribute("aria-label", label);
});

// ---------- labels pinned to 3D points ----------
const tagHome = document.getElementById("tag-home");
const tagPub = document.getElementById("tag-pub");
function placeTag(el, pos, lift) {
  const v = pos.clone().project(camera);
  if (v.z > 1) { el.classList.remove("on"); return; }
  const w = stage.clientWidth, h = stage.clientHeight;
  el.style.left = ((v.x + 1) / 2 * w) + "px";
  el.style.top = ((1 - v.y) / 2 * h) + "px";
  el.classList.add("on");
}
function placeTags() {
  placeTag(tagHome, new THREE.Vector3(hp.x, 0.27, hp.z), 0);
  if (selected !== null) {
    const pg = pins[selected].g.position;
    placeTag(tagPub, new THREE.Vector3(pg.x, 0.09, pg.z), 0);
    tagPub.textContent = PUBS[selected][0];
  } else {
    tagPub.classList.remove("on");
  }
}

// ---------- resize and loop ----------
new ResizeObserver(() => {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}).observe(stage);

function tick() {
  controls.update();
  renderer.render(scene, camera);
  placeTags();
  if (window.stepWeather) window.stepWeather();
  requestAnimationFrame(tick);
}

// ---------- sheet: name, photo, completion ----------
const sheet = document.getElementById("sheet");

function el(tag, props, kids) {
  const n = document.createElement(tag);
  for (const k in (props || {})) {
    if (k === "text") n.textContent = props[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), props[k]);
    else n.setAttribute(k, props[k]);
  }
  (kids || []).forEach(c => n.appendChild(c));
  return n;
}

function renderSheet() {
  if (selected === null) { sheet.hidden = true; sheet.replaceChildren(); return; }
  sheet.hidden = false;
  const p = PUBS[selected];
  const rec = state.done[selected];
  const kids = [
    el("div", { class: "eyebrow", text: rec ? "Completed" : "Not done yet" }),
    el("h2", { text: p[0] }),
    el("div", { class: "addr", text: p[1] || "Address not on map" })
  ];
  if (rec) {
    kids.push(el("div", { class: "status", text: `Completed ${new Date(rec.at).toLocaleString()}` }));
    kids.push(el("div", { class: "btnrow" }, [
      el("button", { class: "btn ghost", text: "Undo completion", onclick: () => {
        delete state.done[selected]; save(); refreshPins(); renderSheet();
      } })
    ]));
  } else {
    kids.push(el("div", { class: "status", text: "Tap below once you're at this pub." }));
    kids.push(el("div", { class: "btnrow" }, [
      el("button", { class: "btn", text: "Mark complete", onclick: () => markDone() })
    ]));
  }
  sheet.replaceChildren(...kids);
}

function markDone() {
  state.done[selected] = { at: new Date().toISOString() };
  save();
  refreshPins();
  renderSheet();
}

// ---------- start ----------
buildBuildings();
applyPalette();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyPalette);
// Street data is loaded as a script so the page also works when opened straight from disk.
LINES = (window.STREETS_DATA && window.STREETS_DATA.lines) || [];
applyPalette();
renderSheet();
tick();

// ---------- weather (Open-Meteo, no API key) ----------
const WX = { 0: "clear", 1: "mostly clear", 2: "partly cloudy", 3: "overcast", 45: "fog", 48: "fog",
  51: "light drizzle", 53: "drizzle", 55: "heavy drizzle", 61: "light rain", 63: "rain", 65: "heavy rain",
  71: "light snow", 73: "snow", 75: "heavy snow", 80: "rain showers", 81: "rain showers", 82: "heavy showers",
  95: "thunderstorm", 96: "thunderstorm", 99: "thunderstorm" };
async function loadWeather() {
  const out = document.getElementById("wxtext");
  try {
    const url = "https://api.open-meteo.com/v1/forecast?latitude=50.08&longitude=14.43" +
      "&current=temperature_2m,weather_code,wind_speed_10m&timezone=Europe%2FPrague";
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    const c = (await r.json()).current;
    const sky = WX[c.weather_code] || "mixed";
    out.textContent = `Prague now: ${Math.round(c.temperature_2m)}°C, ${sky}, wind ${Math.round(c.wind_speed_10m)} km/h`;
    applyWeather("snow");
  } catch (e) {
    out.textContent = "Weather unavailable right now";
  }
}
// ---------- weather effects: fog, light, rain and snow over the city ----------
const WX_MODES = {
  clear:  { sun: 0.7,  fog: null,      rain: false, snow: false },
  cloudy: { sun: 0.35, fog: [6, 14],   rain: false, snow: false },
  rain:   { sun: 0.25, fog: [5, 12],   rain: true,  snow: false },
  snow:   { sun: 0.35, fog: [5, 12],   rain: false, snow: true  },
  fog:    { sun: 0.2,  fog: [1.5, 6],  rain: false, snow: false }
};
function modeFromCode(c) {
  if (c === 45 || c === 48) return "fog";
  if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82) || c >= 95) return "rain";
  if (c >= 71 && c <= 77) return "snow";
  if (c >= 2) return "cloudy";
  return "clear";
}

const rainCount = 1400;
const rainPos = new Float32Array(rainCount * 6);
function seedRain(i) {
  const x = (Math.random() - 0.5) * WW * 1.2, y = 0.6 + Math.random() * 0.8, z = (Math.random() - 0.5) * WH * 1.2;
  rainPos.set([x, y, z, x, y + 0.025, z], i * 6);
}
for (let i = 0; i < rainCount; i++) seedRain(i);
const rainGeo = new THREE.BufferGeometry();
rainGeo.setAttribute("position", new THREE.BufferAttribute(rainPos, 3));
const rainSys = new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({ color: 0x9dbbe0, transparent: true, opacity: 0.55 }));
rainSys.visible = false;
scene.add(rainSys);

const snowCount = 1200;
const snowPos = new Float32Array(snowCount * 3);
function seedSnow(i) {
  snowPos[i * 3] = (Math.random() - 0.5) * WW * 1.2;
  snowPos[i * 3 + 1] = 0.6 + Math.random() * 0.8;
  snowPos[i * 3 + 2] = (Math.random() - 0.5) * WH * 1.2;
}
for (let i = 0; i < snowCount; i++) seedSnow(i);
const snowGeo = new THREE.BufferGeometry();
snowGeo.setAttribute("position", new THREE.BufferAttribute(snowPos, 3));
const snowSys = new THREE.Points(snowGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.012, transparent: true, opacity: 0.9 }));
snowSys.visible = false;
scene.add(snowSys);

window.stepWeather = function () {
  if (rainSys.visible) {
    for (let i = 0; i < rainCount; i++) {
      const k = i * 6;
      rainPos[k + 1] -= 0.012; rainPos[k + 4] -= 0.012;
      if (rainPos[k + 1] < 0) seedRain(i);
    }
    rainGeo.attributes.position.needsUpdate = true;
  }
  if (snowSys.visible) {
    const t = performance.now() / 1000;
    for (let i = 0; i < snowCount; i++) {
      const k = i * 3;
      snowPos[k + 1] -= 0.003;
      snowPos[k] += Math.sin(i + t) * 0.0004;
      if (snowPos[k + 1] < 0) seedSnow(i);
    }
    snowGeo.attributes.position.needsUpdate = true;
  }
};

function applyWeather(mode) {
  const m = WX_MODES[mode] || WX_MODES.clear;
  sunLight.intensity = m.sun;
  scene.fog = m.fog ? new THREE.Fog(pal().bg, m.fog[0], m.fog[1]) : null;
  rainSys.visible = m.rain;
  snowSys.visible = m.snow;
  document.querySelectorAll("#wxbtns button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
}

// The map is always snowing.
applyWeather("snow");

loadWeather();
setInterval(loadWeather, 30 * 60 * 1000);
</script>
