<style>
/* Vice-style look: sunny day (light) and neon night (dark); the page and the map share one sky */
:root{
  --bg:#eceff5; --panel:rgba(255,255,255,.72); --panel2:rgba(255,255,255,.6); --ink:#2a1240; --muted:#7a4f7f; --line:rgba(42,18,64,.16);
  --sun:#ff7a1a; --accent:#e0328c; --done:#13945a; --glass:rgba(255,255,255,.78);
  --sky1:#6fd3f7; --skym:#ffc2dc; --sky2:#ffe1c4;
  --shadow:0 2px 6px rgba(42,18,64,.08),0 12px 30px rgba(224,50,140,.12);
  --f-head:Anton,"Space Grotesk",Impact,sans-serif; --f-body:Inter,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#080d18; --panel:rgba(22,8,40,.72); --panel2:rgba(40,14,66,.7); --ink:#fdeaff; --muted:#c9a7d6; --line:rgba(255,79,163,.28);
    --sun:#ffb23e; --accent:#ff4fa3; --done:#39ff88; --glass:rgba(22,8,40,.75);
    --sky1:#0d0620; --skym:#2a0c3d; --sky2:#5a1747;
    --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 30px rgba(255,79,163,.15); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#080d18; --panel:rgba(22,8,40,.72); --panel2:rgba(40,14,66,.7); --ink:#fdeaff; --muted:#c9a7d6; --line:rgba(255,79,163,.28);
  --sun:#ffb23e; --accent:#ff4fa3; --done:#39ff88; --glass:rgba(22,8,40,.75);
  --sky1:#0d0620; --skym:#2a0c3d; --sky2:#5a1747;
  --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 30px rgba(255,79,163,.15); color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:22px 48px}
.app{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font:700 clamp(28px,5vw,40px)/1.05 var(--f-head);letter-spacing:-.02em;margin:0}
h2{font:400 24px/1.1 var(--f-head);letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:60ch}
.eyebrow{font:500 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.tile{background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;min-width:150px}
.tile .k{font-size:11.5px;opacity:.7;letter-spacing:.04em}
.tile .v{font:600 26px/1.1 var(--f-head);font-variant-numeric:tabular-nums}
.stage{position:relative;height:clamp(380px,64vh,580px);border-radius:12px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,var(--sky1),var(--skym) 55%,var(--sky2));touch-action:none}
.stage canvas{display:block;width:100%;height:100%;cursor:grab}
.fsbtn{position:absolute;right:10px;bottom:10px;z-index:2;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--glass);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.fsbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fsbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stage:fullscreen{height:100vh;height:100dvh;width:100%;border:0;border-radius:0;background:linear-gradient(180deg,var(--sky1),var(--skym) 55%,var(--sky2))}
.stage:-webkit-full-screen{height:100vh;width:100%;border:0;border-radius:0;background:linear-gradient(180deg,var(--sky1),var(--skym) 55%,var(--sky2))}
.stage.fakefull{position:fixed;inset:0;height:100%;width:100%;z-index:50;border:0;border-radius:0;background:linear-gradient(180deg,var(--sky1),var(--skym) 55%,var(--sky2))}
.stage canvas:active{cursor:grabbing}
.tools{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.tools button{font:600 14px/1 var(--f-body);width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--glass);color:var(--ink);cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tools button{display:grid;place-items:center;padding:0}
.tools svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tools button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);background:var(--glass);padding:4px 8px;border-radius:8px;z-index:2;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-115%);pointer-events:none;white-space:nowrap;font:700 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:6px 9px;border-radius:8px;background:var(--ink);color:var(--bg);opacity:0;transition:opacity .15s;z-index:1}
.tag.on{opacity:1}
.tag.hot{background:#5ef0de;color:#1f2328;box-shadow:0 0 0 2px #1f2328}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.namerow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.namerow label{color:var(--muted)}
input[type=text]{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-width:0;flex:1 1 180px}
input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sheet{display:grid;gap:10px}
.sheet[hidden]{display:none}
.sheet .addr{color:var(--muted)}
.sheet .status{color:var(--muted);font-size:13.5px}
.sheet img{width:100%;height:auto;border-radius:12px;display:block}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{position:relative;display:inline-block;font:600 14px/1.2 var(--f-body);background:var(--accent);color:#fff;border:0;border-radius:999px;padding:10px 18px;cursor:pointer;overflow:hidden}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-within,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.btn.dim{opacity:.5;cursor:default}
.pintcard{flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
.pintcard > div:empty{display:none}
.pint{position:relative;width:100%;max-width:520px;height:40px;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--panel2)}
.beer{position:absolute;top:0;bottom:0;left:0;width:var(--fill,0%);background:linear-gradient(180deg,#fcd66b,#f7b733 50%,#e08e0b);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.beer::after{content:"";position:absolute;right:-7px;top:-3px;bottom:-3px;width:18px;background:#fff6dc;border-radius:50%;animation:slosh 3.2s ease-in-out infinite alternate}
.beer.empty::after{display:none}
@keyframes slosh{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
.pintlabel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6px;font:500 14px var(--f-body);color:var(--fg);text-shadow:0 0 4px var(--bg),0 0 2px var(--bg);pointer-events:none;z-index:1;white-space:nowrap}
.pintlabel span{font:400 19px var(--f-head);letter-spacing:.04em}
.pintcard{position:relative}
.topbar{display:flex;justify-content:flex-end}
.progressrow{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.progressrow .pint{flex:1;min-width:0}
.tools.tools-left{left:10px;right:auto}
.themebtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0;z-index:1}
.themebtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.themebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.homebtn{display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:999px;background:linear-gradient(90deg,#ff4fa3,#ff7a1a);color:#fff;font:400 24px var(--f-head);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;text-shadow:0 2px 0 rgba(0,0,0,.25);box-shadow:0 8px 24px rgba(255,79,163,.35);margin-top:4px}
.homebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.intro{position:absolute;inset:0;z-index:3;display:grid;place-content:center;text-align:center;cursor:pointer;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 30%,rgba(0,0,0,.35));transition:opacity .8s}
.intro.out{opacity:0;pointer-events:none}
.intro-title{font:400 clamp(48px,12vw,104px)/.9 var(--f-head);letter-spacing:.04em;text-transform:uppercase;background:linear-gradient(90deg,#ff4fa3,#ffb23e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35));animation:introIn 1.2s cubic-bezier(.2,.8,.2,1) both}
.intro-sub{margin-top:10px;font:600 13px var(--f-body);letter-spacing:.3em;text-transform:uppercase;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6);animation:introIn 1.2s .3s cubic-bezier(.2,.8,.2,1) both}
.intro-skip{position:absolute;bottom:14px;left:0;right:0;font:500 11px var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.85);text-shadow:0 1px 4px rgba(0,0,0,.6)}
@keyframes introIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
.gtabtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;padding:0 18px;border:2px solid #1f2328;border-radius:999px;background:#ffd84a;color:#1f2328;font:400 24px var(--f-head);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:0 8px 24px rgba(255,216,74,.35);transition:transform .08s}
.gtabtn svg{width:24px;height:24px;fill:none;stroke:#1f2328;stroke-width:2.5;stroke-linecap:round}
.gtabtn:active{transform:translateY(1px)}
.gtabtn[aria-expanded="true"]{background:#5ef0de}
.gtabtn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(0,0,0,.35);cursor:pointer}
.splash[hidden]{display:none}
.splash-band{width:100%;padding:24px 16px;text-align:center;background:linear-gradient(90deg,transparent,rgba(10,6,20,.88) 18%,rgba(10,6,20,.88) 82%,transparent);animation:bandIn .5s cubic-bezier(.2,.8,.2,1) both}
.splash-title{font:400 clamp(46px,12vw,92px)/.95 var(--f-head);letter-spacing:.04em;text-transform:uppercase;color:#ffd84a;text-shadow:0 3px 0 #1f2328;animation:titleIn .6s .1s cubic-bezier(.2,.8,.2,1) both}
.splash-sub{margin-top:10px;font:600 14px var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:#fff;animation:titleIn .6s .25s cubic-bezier(.2,.8,.2,1) both}
@keyframes bandIn{from{transform:scaleX(.15);opacity:0}to{transform:none;opacity:1}}
@keyframes titleIn{from{transform:scale(1.35);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.splash-band,.splash-title,.splash-sub{animation:none}}
body.fs-open{overflow:hidden}
body.fs-open .card{-webkit-backdrop-filter:none;backdrop-filter:none}
.stage.fakefull .tools{top:calc(10px + env(safe-area-inset-top,0px))}
.stage.fakefull .tools:not(.tools-left){right:calc(10px + env(safe-area-inset-right,0px))}
.stage.fakefull .tools.tools-left{left:calc(10px + env(safe-area-inset-left,0px))}
.stage.fakefull .fsbtn{bottom:calc(10px + env(safe-area-inset-bottom,0px));right:calc(10px + env(safe-area-inset-right,0px))}
.findbox{display:grid;gap:8px}
.findbox[hidden]{display:none}
.gtabtn.iconbtn{width:44px;height:44px;min-height:44px;padding:0;flex:none;box-shadow:none}
.gtabtn.iconbtn svg{width:22px;height:22px}
#findpanel{margin-bottom:14px}
.findbox .lbl{color:var(--muted);font-size:13px}
.findbox input[type=search]{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;width:100%}
.results{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.results:empty{display:none}
.results button{width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.results button:hover{border-color:var(--muted)}
.results button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.results .none{color:var(--muted);font-size:13px;padding:6px 4px}
.wxbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.wxbtns button{font:500 12px var(--f-body);border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer}
.wxbtns button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.wxbtns button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:600px){
  input[type=text],input[type=search]{font-size:16px;min-height:44px}
  .tools button,.fsbtn{width:44px;height:44px}
  .tools svg,.fsbtn svg{width:22px;height:22px}
  .btn{min-height:44px;display:inline-flex;align-items:center}
  .results button{min-height:44px}
  .wxbtns button{min-height:38px;padding:6px 12px}
  .hint{display:none}
  .stage{height:min(62vh,520px);min-height:340px}
  .pint{height:34px}
  .sheet{padding:14px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} .beer::after{animation:none} }
/* Map buttons in the same icon style as the blips: white badge, dark outline, dark symbol */
.tools button,.fsbtn,.themebtn{width:44px;height:44px;border-radius:999px;border:2px solid #1f2328;background:#ffffff;color:#1f2328;box-shadow:0 2px 8px rgba(0,0,0,.2);-webkit-backdrop-filter:none;backdrop-filter:none}
.tools svg,.fsbtn svg,.themebtn svg{width:22px;height:22px;stroke:#1f2328;stroke-width:2.5}
.tools button:active,.fsbtn:active,.themebtn:active{transform:translateY(1px)}
</style>
</head>

<div class="app">


  <div class="card">
    <div class="progressrow">
      <button class="gtabtn iconbtn" id="findbtn" aria-label="Find a pub" title="Find a pub" aria-expanded="false" aria-controls="findpanel"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></button>
      <div class="pint"><div class="beer" id="beer"></div><div class="pintlabel" aria-live="polite"><span id="count">0 / 78</span> pubs done</div></div>
    </div>
    <div class="findbox" id="findpanel" hidden>
      <input type="search" id="find" placeholder="Find a pub: type a name or street" autocomplete="off" aria-label="Find a pub">
      <ul id="results" class="results"></ul>
    </div>
    <div class="stage" id="stage">
      <div class="intro" id="intro" role="button" aria-label="Skip intro">

        <div class="intro-skip">Tap to skip</div>
      </div>
      <div class="tools tools-left">
        <button id="theme" class="themebtn" aria-label="Switch theme" title="Switch theme"></button>
      </div>
      <div class="tools">

      </div>
      <div class="hint">Drag to turn · pinch to zoom</div>
      <button id="full" class="fsbtn" aria-label="Full screen" title="Full screen"></button>
      <div class="tag hot" id="tag-home">Airbnb · Sokolská 1605</div>
      <div class="tag" id="tag-pub"></div>
    </div>
    <div class="legend">
      <span><i style="background:#8f96a3;border:2px solid #1f2328;border-radius:3px"></i>Not done</span>
      <span><i style="background:#5ff08f;border:2px solid #1f2328;border-radius:3px"></i>Done</span>
      <span><i style="background:#5ef0de;border:2px solid #1f2328;border-radius:3px"></i>Airbnb (Sokolská 1605)</span>
    </div>
    <div class="legend">Map data © OpenStreetMap contributors</div>
  </div>

  <div class="card sheet" id="sheet" hidden></div>




  <div class="splash" id="splash" hidden aria-live="assertive">
    <div class="splash-band">
      <div class="splash-title" id="splashtitle">Pub complete</div>
      <div class="splash-sub" id="splashsub"></div>
    </div>
  </div>
  <a class="homebtn" href="https://www.google.com/maps/dir/?api=1&destination=50.0768087,14.4293390" target="_blank" rel="noopener">Get Me Home</a>
</div>

<script src="data/streets.js"></script>

const BUILD_VERT = 2.5; // vertical exaggeration so the city reads at this scale

function buildBuildings() {
  const list = window.BUILDINGS_DATA || [];
  if (!list.length) return;
  const geos = [];
  for (const [h, ring] of list) {
    // Skip buildings outside the round map.
    const [la0, lo0] = ring[0];
    if (Math.hypot((lo0 - LON0) * KM_LON - WW / 2, (la0 - LAT0) * KM_LAT - WH / 2) > MAP_R - 0.01) continue;
    const shape = new THREE.Shape();
    ring.forEach(([lat, lon], j) => {
      const x = (lon - LON0) * KM_LON - WW / 2;
      const y = (lat - LAT0) * KM_LAT - WH / 2;
      if (j) shape.lineTo(x, y); else shape.moveTo(x, y);
    });
    const g = new THREE.ExtrudeGeometry(shape, { depth: (h / 1000) * BUILD_VERT, bevelEnabled: false });

}

// ---------- street texture, drawn from the OSM export ----------
let LINES = [];
let tex = null;
const CW = 2048, CH = Math.round(CW * WH / WW);
const pxy = (lat, lon) => [(lon - LON0) / (LON1 - LON0) * CW, (LAT1 - lat) / (LAT1 - LAT0) * CH];

function drawMap(p) {
  const c = document.createElement("canvas");
  c.width = CW; c.height = CH;
  const g = c.getContext("2d");
  g.fillStyle = p.ground; g.fillRect(0, 0, CW, CH);
  g.lineCap = "round"; g.lineJoin = "round";
  const layers = [["minor", 2.2, p.minor], ["mid", 4.5, p.mid], ["major", 8, p.major], ["water", 46, p.water]];
  for (const [cls, width, color] of layers) {
    g.strokeStyle = color; g.lineWidth = width;
    for (const [k, pts] of LINES) {
      if (k !== cls) continue;
      g.beginPath();
      pts.forEach((ll, j) => { const [x, y] = pxy(ll[0], ll[1]); j ? g.lineTo(x, y) : g.moveTo(x, y); });
      g.stroke();
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

    else n.setAttribute(k, props[k]);
  }
  (kids || []).forEach(c => n.appendChild(c));
  return n;
}

function renderSheet() {
  if (selected === null) { sheet.hidden = true; sheet.replaceChildren(); return; }
  sheet.hidden = false;
  const p = PUBS[selected];
  const rec = state.done[selected];
  const kids = [
    el("div", { class: "eyebrow", text: rec ? "Completed" : "Not done yet" }),
    el("h2", { text: p[0] }),
    el("div", { class: "addr", text: p[1] || "Address not on map" })
  ];
  if (rec) {
    kids.push(el("div", { class: "status", text: `Completed ${new Date(rec.at).toLocaleString()}` }));
    kids.push(el("div", { class: "btnrow" }, [
      el("button", { class: "btn ghost", text: "Undo completion", onclick: () => {
        delete state.done[selected]; save(); refreshPins(); renderSheet();
      } })
    ]));
  } else {
    kids.push(el("div", { class: "status", text: "Tap below once you're at this pub." }));
    kids.push(el("div", { class: "btnrow" }, [
      el("button", { class: "btn", text: "Mark complete", onclick: () => markDone() })
    ]));
  }
  sheet.replaceChildren(...kids);
}

function markDone() {
  state.done[selected] = { at: new Date().toISOString() };
  save();
  refreshPins();
  renderSheet();
  showSplash(PUBS[selected][0]);
}

// "Pub complete" splash: a band across the screen that clears itself after a moment.
let splashTimer = null;
function hideSplash() {
  clearTimeout(splashTimer);
  document.getElementById("splash").hidden = true;
}
function showSplash(pubName) {
  const n = Object.keys(state.done).length;
  const all = n >= PUBS.length;
  document.getElementById("splashtitle").textContent = all ? "Crawl complete" : "Pub complete";
  document.getElementById("splashsub").textContent = `${pubName} · +1 pint · ${n} / ${PUBS.length}`;
  const s = document.getElementById("splash");
  // re-trigger the animation when two pubs are completed close together
  s.hidden = true; void s.offsetWidth; s.hidden = false;
  clearTimeout(splashTimer);
  splashTimer = setTimeout(hideSplash, all ? 5000 : 2600);
}
document.getElementById("splash").addEventListener("click", hideSplash);

// ---------- start ----------
// ---------- intro flyover: a low sweep around the city that settles into the normal view ----------
const INTRO_MS = 6500;
const introEl = document.getElementById("intro");
let introStart = null;
let introOn = !matchMedia("(prefers-reduced-motion: reduce)").matches;
const easeInOut = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const lerp = (a, b, t) => a + (b - a) * t;
function endIntro() {
  if (!introOn) return;
  introOn = false;
  beacon.visible = true;
  camera.position.copy(DEFAULT_POS);
  controls.target.set(0, 0, 0);
  controls.update();
  introEl.classList.add("out");
}
window.runIntro = function () {
  if (!introOn) return false;
  const now = performance.now();
  if (introStart === null) { introStart = now; beacon.visible = false; }
  const t = Math.min(1, (now - introStart) / INTRO_MS);
  const e = easeInOut(t);
  const ang = lerp(-2.4, 0, e);           // swing round from the far side of the river
  const r = lerp(2.4, DEFAULT_POS.z, e);  // pull back
  const h = lerp(0.9, DEFAULT_POS.y, e);  // and climb
  const tx = lerp(0.4, 0, e), tz = lerp(-0.4, 0, e);
  controls.target.set(tx, 0, tz);
  camera.position.set(tx + Math.sin(ang) * r, h, tz + Math.cos(ang) * r);
  camera.lookAt(controls.target);
  if (t >= 1) endIntro();
  return true;
};
introEl.addEventListener("click", endIntro);
if (!introOn) introEl.classList.add("out");

// ---------- light / dark (remembered on this phone) ----------
const THEME_KEY = "pubtracker-theme";
try {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
} catch (e) {}
const themeBtn = document.getElementById("theme");
const ICON_SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const ICON_MOON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function paintThemeBtn() {
  const dark = isDark();
  themeBtn.innerHTML = dark ? ICON_SUN : ICON_MOON;
  const label = dark ? "Switch to light mode" : "Switch to dark mode";
  themeBtn.title = label;
  themeBtn.setAttribute("aria-label", label);
}
themeBtn.addEventListener("click", () => {
  const next = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  applyPalette();
  applyWeather("snow"); // refresh the fog colour for the new theme
  paintThemeBtn();
});

buildBuildings();
applyPalette();
paintThemeBtn();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyPalette);
// Street data is loaded as a script so the page also works when opened straight from disk.
LINES = (window.STREETS_DATA && window.STREETS_DATA.lines) || [];
applyPalette();
renderSheet();
tick();

// ---------- weather effects: fog, light, rain and snow over the city ----------
const WX_MODES = {
  clear:  { sun: 0.7,  fog: null,      rain: false, snow: false },
  cloudy: { sun: 0.35, fog: [6, 14],   rain: false, snow: false },
  rain:   { sun: 0.25, fog: [5, 12],   rain: true,  snow: false },
  snow:   { sun: 0.35, fog: [5, 12],   rain: false, snow: true  },
  fog:    { sun: 0.2,  fog: [1.5, 6],  rain: false, snow: false }
};

const rainCount = 1400;
const rainPos = new Float32Array(rainCount * 6);
function seedRain(i) {
  const x = (Math.random() - 0.5) * WW * 1.2, y = 0.6 + Math.random() * 0.8, z = (Math.random() - 0.5) * WH * 1.2;
  rainPos.set([x, y, z, x, y + 0.025, z], i * 6);
}
for (let i = 0; i < rainCount; i++) seedRain(i);
const rainGeo = new THREE.BufferGeometry();
rainGeo.setAttribute("position", new THREE.BufferAttribute(rainPos, 3));
const rainSys = new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({ color: 0x9dbbe0, transparent: true, opacity: 0.55 }));
rainSys.visible = false;
scene.add(rainSys);

const snowCount = 1200;
const snowPos = new Float32Array(snowCount * 3);
function seedSnow(i) {
  snowPos[i * 3] = (Math.random() - 0.5) * WW * 1.2;
  snowPos[i * 3 + 1] = 0.6 + Math.random() * 0.8;
  snowPos[i * 3 + 2] = (Math.random() - 0.5) * WH * 1.2;
}
for (let i = 0; i < snowCount; i++) seedSnow(i);
const snowGeo = new THREE.BufferGeometry();
snowGeo.setAttribute("position", new THREE.BufferAttribute(snowPos, 3));
const snowSys = new THREE.Points(snowGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.012, transparent: true, opacity: 0.9 }));
snowSys.visible = false;
scene.add(snowSys);

window.stepWeather = function () {
  if (rainSys.visible) {
    for (let i = 0; i < rainCount; i++) {
      const k = i * 6;
      rainPos[k + 1] -= 0.012; rainPos[k + 4] -= 0.012;
      if (rainPos[k + 1] < 0) seedRain(i);
    }
    rainGeo.attributes.position.needsUpdate = true;
  }
  if (snowSys.visible) {
    const t = performance.now() / 1000;
    for (let i = 0; i < snowCount; i++) {
      const k = i * 3;
      snowPos[k + 1] -= 0.003;
      snowPos[k] += Math.sin(i + t) * 0.0004;
      if (snowPos[k + 1] < 0) seedSnow(i);
    }
    snowGeo.attributes.position.needsUpdate = true;
  }
};

function applyWeather(mode) {
  const m = WX_MODES[mode] || WX_MODES.clear;
  sunLight.intensity = m.sun;
  scene.fog = m.fog ? new THREE.Fog(pal().bg, m.fog[0], m.fog[1]) : null;
  rainSys.visible = m.rain;
  snowSys.visible = m.snow;
  document.querySelectorAll("#wxbtns button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
}

// The map is always snowing.
applyWeather("snow");
</script>
